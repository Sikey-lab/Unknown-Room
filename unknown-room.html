  // Stages I–III latch responses. IV–V require a single, complete conjunction.

  const C = {gold:'#c9b68b',blue:'#85b9b7',red:'#bf8176',dim:'#4c6256'};

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(resolve => setTimeout(resolve,reduced ? Math.min(ms,140) : ms));
  const fmt = ms => { const s = Math.round(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
  const roman = ['I','II','III','IV','V'];
  const STAGES = [
    {name:'Resonance',halo:{x:440,y:330},nodes:[{id:'a',x:440,y:330,kind:'gold'}],coupled:false,
      insight:'A pulse reaches an amber point inside the inner circle. The first response establishes a relationship between position, light, and consequence.'},
    {name:'Displacement',halo:{x:440,y:330},nodes:[{id:'a',x:320,y:280,kind:'gold'},{id:'b',x:650,y:390,kind:'gold'}],coupled:false,
      insight:'The same relationship survives a change in location. Moving the field and pulsing each amber point stores two separate responses.'},
    {name:'Difference',halo:{x:600,y:330},nodes:[{id:'a',x:330,y:330,kind:'gold'},{id:'b',x:600,y:330,kind:'blue'}],coupled:false,
      insight:'Blue responds in the outer band, not at the center. An unsuccessful pulse at a blue point makes the second region of the field visible. Each color has a different spatial rule.'},

          const t=(now-this.pulseAt)/1500;flow.setAttribute('stroke-opacity',String(Math.sin(Math.min(1,t)*Math.PI)*.9));flow.setAttribute('stroke-dasharray','.12 .88');flow.setAttribute('stroke-dashoffset',String(feedback.good?-t*1.4:(t<.5?-t*1.6:-(1-t)*1.6)));
        }else flow.setAttribute('stroke-opacity','0');
      });
      if(def.coupled){const top=s.gate.y-(s.nodes.length-1)*7-7,bottom=s.gate.y+(s.nodes.length-1)*7+7;$('coupling').setAttribute('d',`M${s.gate.x-62} ${top}h-6V${bottom}h6`);$('coupling').setAttribute('opacity',readyIDs.length===this.allNodes().length?'.9':'.4');}
      $('gate-body').setAttribute('transform',`translate(${s.gate.x} ${s.gate.y})`);
      const open=s.solved?clamp((now-this.pulseAt)/1300,0,1):0;
      $('gate-light').setAttribute('stroke-opacity',s.awake?'.85':open?String(open):'.035');$('gate-light').setAttribute('r',String(32+open*7));$('gate-seed').setAttribute('opacity',s.awake?'1':String(.07+open*.8));$('gate-seed').setAttribute('r',String(s.awake?8:4+open*12));$('gate-seam').setAttribute('opacity',String(1-open));
      this.fx=this.fx.filter(f=>now-f.born<1550);
      $('effects').innerHTML=this.fx.map(f=>{
        const t=clamp((now-f.born)/1500,0,1),fade=(1-t)**1.6;
        if(f.type==='pulse')return `<circle cx="${f.x}" cy="${f.y}" r="${reduced?146:8+t*200}" fill="none" stroke="${f.color}" stroke-opacity="${fade*.65}" stroke-width=".8"/><circle cx="${f.x}" cy="${f.y}" r="${reduced?104:8+t*150}" fill="none" stroke="${C.blue}" stroke-opacity="${fade*.4}" stroke-width=".6"/>`;
        if(f.type==='response')return `<circle cx="${f.x}" cy="${f.y}" r="${reduced?29:17+t*38}" fill="none" stroke="${f.color}" stroke-opacity="${fade*.9}" stroke-width="1"/>`;
        const d=dist(f,s.halo),dx=d<1?1:(f.x-s.halo.x)/d,dy=d<1?0:(f.y-s.halo.y)/d,desired=f.kind==='blue'?125:40;
        // The missing point's own color identifies the region it needs.
        const px=s.halo.x+dx*desired,py=s.halo.y+dy*desired;
        return `<circle cx="${f.x}" cy="${f.y}" r="${reduced?22:18+Math.sin(t*Math.PI)*7}" fill="none" stroke="${f.color}" stroke-opacity="${fade*.7}" stroke-dasharray="2 5"/><path d="M${f.x} ${f.y}L${px} ${py}" stroke="${f.color}" stroke-opacity="${fade*.32}" stroke-width=".7" stroke-dasharray="2 5"/><circle cx="${px}" cy="${py}" r="3" fill="none" stroke="${f.color}" stroke-opacity="${fade*.7}"/>`;
      }).join('');
    }

    renderDebrief(){
      const session=this.session,events=session.events,pulses=events.filter(e=>e.type==='pulse'),moves=events.filter(e=>e.type==='move'),drags=events.filter(e=>e.type==='drag'),productive=pulses.filter(e=>e.effective),ineffective=events.filter(e=>e.effective===false&&e.type!=='reset'),resets=events.filter(e=>e.type==='reset').length;
      const style=drags.length>moves.length*.65&&drags.length>pulses.length*.5?'Object-led':moves.length>pulses.length*1.4?'Spatial':pulses.length>moves.length*1.4?'Signal-led':'Alternating';
      const styleText={ 'Object-led':'You spent more of your adjustments moving parts of the instrument. Objects, and their relationship to the field, became a frequent testing ground.',Spatial:'You moved the field more often than you sent a pulse. Much of your exploration happened through spatial adjustments before a test.','Signal-led':'You sent pulses more often than you moved the field. Direct responses from the instrument were a frequent part of your exploration.',Alternating:'You moved between repositioning the field and testing its response. Neither movement nor pulsing dominated your recorded actions.'}[style];
      const transfer=session.stages[1].firstResponse,deep=pulses.filter(e=>e.stage>=3),deepGood=deep.filter(e=>e.effective),rev=session.revisions,flex=session.flex;
      const metrics=[
        ['Exploration Style',style,`${styleText} This session included ${moves.length} field movements, ${drags.length} object adjustments, and ${pulses.length} pulses.`],
        ['Rule Discovery Efficiency',`${productive.length} / ${pulses.length} pulses`,`Those ${productive.length} pulses stored a new response, awakened the aperture, or completed a circuit. Other pulses supplied feedback without advancing the state.`],
        ['Cognitive Flexibility',flex.total?`${flex.changed} interaction shifts`:'No comparison yet',flex.total?`After unproductive pulses, you changed between field movement and object adjustment in ${flex.changed} of ${flex.total} comparable follow-up interventions.`:'There were too few comparable follow-up interventions after unproductive pulses to describe a pattern.'],
        ['Hypothesis Persistence',`${session.repeatFailures} repeated outcomes`,'This counts consecutive unsuccessful trials using the same responding points and approximately the same field and object positions. Repetition can also be a deliberate check.'],
        ['Transfer Learning',transfer?`${transfer.actions} actions to reuse`:'Not observed',transfer?`In Room II, the familiar inner-field rule first produced a new response after ${transfer.actions} actions and ${fmt(transfer.time)}. This describes reuse within this experiment only.`:'No reuse event was recorded.'],
        ['Planning Efficiency',`${deepGood.length} / ${deep.length} decisive pulses`,`In the two coupled rooms, ${deepGood.length} of ${deep.length} pulses advanced the circuit. You made ${events.filter(e=>e.stage>=3&&(e.type==='move'||e.type==='drag')).length} position adjustments there. Preparatory thought itself is not observable.`],
        ['Evidence Sensitivity',rev.total?`${rev.changed} / ${rev.total} trials revised`:'No contradictory trials',rev.total?`After a pulse made no progress, ${rev.changed} of ${rev.total} next trials used a different response pattern or changed position by roughly 40 room units. Small refinements may not count.`:'There was no unsuccessful pulse followed by another trial to compare. This session provides no evidence for this pattern.']
      ];
      $('debrief').innerHTML=`
        <div class="debrief-top"><span class="eyebrow">The Unknown Room <span style="color:#4d5e53">/</span> Cognitive debrief</span><span class="eyebrow complete-mark">Circuit complete</span></div>
        <header class="debrief-header"><div><div class="eyebrow">Observation record · 001</div><h1 id="debrief-title" tabindex="-1">You found<br>the <em>system.</em></h1><p>The last door was another part of the instrument.<br>What looked like a destination became a relationship.</p></div><div class="debrief-seal"><svg viewBox="0 0 80 80" fill="none" aria-hidden="true"><circle cx="40" cy="40" r="34" stroke="#85b9b7" stroke-opacity=".4" stroke-dasharray="1 4"/><circle cx="40" cy="40" r="17" stroke="#c9b68b"/><circle cx="40" cy="40" r="4" fill="#c9b68b"/><path d="M40 6 10.55 57H69.45Z" stroke="#899c79" stroke-opacity=".35"/><circle cx="40" cy="6" r="3" fill="#85b9b7"/><circle cx="10.55" cy="57" r="3" fill="#85b9b7"/><circle cx="69.45" cy="57" r="3" fill="#85b9b7"/></svg><p>Five rooms.<br>One visual language.<br>Your own way through.</p></div></header>
        <div class="stats"><div class="stat"><div class="stat-value">${fmt(session.now())}</div><div class="eyebrow">Active session</div></div><div class="stat"><div class="stat-value">${events.length}</div><div class="eyebrow">Total actions</div></div><div class="stat"><div class="stat-value">${ineffective.length}</div><div class="eyebrow">No state progress</div></div><div class="stat"><div class="stat-value">${resets}</div><div class="eyebrow">Room resets</div></div></div>
        <div class="section-heading"><h2>A trace of your thinking</h2><p>Observed behavior, without a score</p></div>
        <div class="metric-grid">${metrics.map((m,i)=>`<article class="metric"><div><h3><span class="metric-index">0${i+1}</span>${m[0]}</h3><div class="metric-value">${m[1]}</div></div><p>${m[2]}</p>${i?'<span class="metric-glyph" aria-hidden="true">'+['','⌁','⇄','↺','↗','∴','◇'][i]+'</span>':''}</article>`).join('')}</div>
        <p class="observation-note">These descriptions reflect actions in this session, not intelligence, personality, or a clinical assessment. A pause does not tell us what you were thinking. Unproductive actions can produce useful evidence. Time excludes hidden tabs; movements are recorded as gestures, not individual frames.</p>
        <div class="section-heading"><h2>Your path through the room</h2><p>Every experiment leaves a trace</p></div>
        <div class="path-panel"><div class="timeline-heading"><h3>Five moments of discovery</h3><div class="legend"><span><i></i>New response</span><span><i class="move-dot"></i>Adjustment</span><span><i class="fail-dot"></i>No progress</span></div></div><svg id="timeline" viewBox="0 0 1000 190" role="img" aria-label="Action timeline across five rooms"></svg><div class="room-tabs" role="tablist" aria-label="Explore each room">${STAGES.map((s,i)=>`<button class="room-tab" id="tab-${i}" role="tab" aria-selected="${i===0}" aria-controls="path-detail" data-stage="${i}" tabindex="${i===0?0:-1}"><span>${roman[i]}</span>${s.name}</button>`).join('')}</div><div class="path-detail" id="path-detail" role="tabpanel" aria-labelledby="tab-0"></div></div>
        <footer class="debrief-footer"><div class="footer-actions"><button class="restart" id="restart">RE-ENTER THE ROOM ↗</button><button class="export" id="export">↓ Export session</button></div><div class="privacy">Entirely local. No accounts. No transmission.<br>Your observation record disappears when you close this page.</div></footer>`;
      this.renderTimeline();this.selectStage(0);
      $('restart').onclick=()=>this.start();$('export').onclick=()=>{const blob=new Blob([JSON.stringify(session.export(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='unknown-room-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
      document.querySelectorAll('.room-tab').forEach(b=>{b.onclick=()=>this.selectStage(+b.dataset.stage);b.onkeydown=e=>{let i=+b.dataset.stage;if(e.key==='ArrowRight')i=(i+1)%5;else if(e.key==='ArrowLeft')i=(i+4)%5;else if(e.key==='Home')i=0;else if(e.key==='End')i=4;else return;e.preventDefault();this.selectStage(i);$('tab-'+i).focus();};});
    }
    renderTimeline(){
      const timeline=$('timeline'),duration=this.session.now()||1,x=t=>70+t/duration*910;
      const scroll=document.createElement('div');scroll.className='timeline-scroll';timeline.before(scroll);scroll.append(timeline);
      timeline.innerHTML=this.session.stages.map((s,i)=>{
        const y=24+i*32,ev=this.session.events.filter(e=>e.stage===i),end=s.end??this.session.now();
        return `<text x="0" y="${y+3}" fill="#94a58e" font-family="Consolas,monospace" font-size="9">${roman[i].padEnd(3,' ')} ${fmt(end-s.start)}</text><path d="M${x(s.start)} ${y}H${x(end)}" stroke="#5b70564d" stroke-width="3"/>`+ev.map(e=>{
          const color=e.type==='pulse'?(e.effective?C.gold:C.red):e.type==='reset'?C.red:'#688e89',r=e.type==='pulse'?3.2:2;
          return `<g tabindex="0" data-event="${e.id}" role="button" aria-label="Room ${roman[i]}, ${e.type}, ${e.outcome}, ${fmt(e.time-s.start)}"><circle cx="${x(e.time)}" cy="${y}" r="8" fill="transparent"/><circle cx="${x(e.time)}" cy="${y}" r="${r}" fill="${color}"/><title>${e.type}: ${e.outcome} · ${fmt(e.time-s.start)}</title></g>`;
        }).join('');
      }).join('')+`<text x="70" y="188" font-family="Consolas,monospace" font-size="8" fill="#6e816c">0:00</text><text x="980" y="188" text-anchor="end" font-family="Consolas,monospace" font-size="8" fill="#6e816c">${fmt(duration)} / FOREGROUND TIME</text>`;
      timeline.querySelectorAll('[data-event]').forEach(el=>{
        const event=this.session.events[+el.dataset.event-1];
        const show=()=>{const r=el.getBoundingClientRect();$('tooltip').textContent=`${roman[event.stage]} · ${fmt(event.time-this.session.stages[event.stage].start)} · ${event.type}\n${event.outcome}`;$('tooltip').style.left=clamp(r.left,12,innerWidth-245)+'px';$('tooltip').style.top=Math.max(12,r.top-65)+'px';$('tooltip').hidden=false;};
        el.addEventListener('pointerenter',show);el.addEventListener('focus',show);el.addEventListener('pointerleave',()=>{$('tooltip').hidden=true;});el.addEventListener('blur',()=>{$('tooltip').hidden=true;});el.addEventListener('click',()=>this.selectStage(event.stage));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();this.selectStage(event.stage);}});
      });
    }
    selectStage(index){
      document.querySelectorAll('.room-tab').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1;});$('path-detail').setAttribute('aria-labelledby','tab-'+index);
      const def=STAGES[index],stage=this.session.stages[index],events=this.session.events.filter(e=>e.stage===index),pulses=events.filter(e=>e.type==='pulse');
      // Reset boundaries start a new path, preventing fictitious travel between attempts.
      let d=`M${def.halo.x} ${def.halo.y}`;
      for(const e of events){if(e.type==='reset')d+=`M${def.halo.x} ${def.halo.y}`;else if(e.type==='move'||e.type==='pulse')d+=`L${e.x} ${e.y}`;}
      const nodes=(pulses.at(-1)?.objects||def.nodes);
      $('path-detail').innerHTML=`<svg class="path-map" viewBox="120 120 770 410" role="img" aria-label="Recorded movement path in room ${roman[index]}"><path d="${d}" stroke="#799b88" stroke-opacity=".55" stroke-width="1.5" fill="none" stroke-dasharray="3 6"/>${nodes.map(n=>`<circle cx="${n.x}" cy="${n.y}" r="10" fill="#0d1612" stroke="${C[n.kind]}" stroke-opacity=".65"/>`).join('')}${pulses.map(e=>`<circle cx="${e.x}" cy="${e.y}" r="${e.effective?7:4}" fill="${e.effective?C.gold:C.red}" fill-opacity=".7"/>`).join('')}<circle cx="${def.halo.x}" cy="${def.halo.y}" r="18" fill="none" stroke="#809574" stroke-dasharray="2 4"/><text x="150" y="505" font-family="Consolas,monospace" font-size="10" fill="#84987d">FIELD PATH / PULSE LOCATIONS</text></svg><div class="path-copy"><h3>${roman[index]}. ${def.name}</h3><p>${def.insight}</p><div class="eyebrow">${fmt(stage.end-stage.start)} in room · ${events.length} actions · ${pulses.length} pulses · ${stage.resets} resets</div></div>`;
    }
  }
  const instrument=new Instrument();
  // Read-only inspection supports reproducible testing without a gameplay shortcut.
  window.UnknownRoom=Object.freeze({inspect:()=>instrument.snapshot()});
})();
</script>
